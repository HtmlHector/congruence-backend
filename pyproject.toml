[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "parabox-backend-starter"
version = "0.1.0"
description = "Parabox Backend Starter — production-ready foundation with Auth, Billing, RLS, Realtime & Workers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "redis[hiredis]>=5.0.8",
    "aio-pika>=9.4.2",
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.9.0",
    "svix>=1.30.0",
    "structlog>=24.4.0",
    "python-multipart>=0.0.9",
    "stripe>=10.8.0",
    "python-socketio>=5.11.0",
    "boto3>=1.35.0",
    "resend>=2.4.0",
    "uuid6>=2024.7.1",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "httpx>=0.27.0",
    "types-redis>=4.6.0.20240425",
    "types-boto3>=1.35.0",
]

[project.scripts]
api = "src.bootstrap.api:start_api"
worker = "src.bootstrap.workers:start_workers"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = ["E501", "B008", "B904"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["socketio.*", "svix.*", "resend.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
