[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "parabox-backend-starter"
version = "0.1.0"
description = "Parabox Backend Starter — Production FastAPI Service with Multi-Tenant RLS, Stripe, LLM Gateway, and Storage"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "redis[hiredis]>=5.0.0",
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.8.0",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=43.0.0",
    "structlog>=24.0.0",
    "python-multipart>=0.0.9",
    "boto3>=1.34.0",
    "stripe>=10.0.0",
    "openai>=2.45.0",
    "anthropic>=0.40.0",
    "fastmcp>=2.0.0",
    "mcp>=2.1.0",
    "nanoid>=2.0.0",
    "aiosqlite>=0.22.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[tool.uv]
index-url = "https://pypi.org/simple"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
ignore = ["B008", "RUF012", "BLE001", "ASYNC222", "S110", "S112"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
