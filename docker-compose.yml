services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/congruence_prod.db
      - ENVIRONMENT=production
      - CORS_ORIGINS=http://localhost:3000,https://congruence.dev
    volumes:
      - runner_data:/data
      - /tmp/congruence_runners:/tmp/congruence_runners
    restart: unless-stopped

volumes:
  runner_data:
