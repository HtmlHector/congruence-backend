name: Feature Request
description: Propose a new capability or primitive for the starter template
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest an idea or new shared primitive for the Parabox backend starter.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or recurring need across products?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Primitive
      description: Describe how the primitive or feature should behave and how products will reuse it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative implementations or libraries you considered.
